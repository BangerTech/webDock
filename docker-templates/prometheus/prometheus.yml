global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - alert.yml

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 2s
    static_configs:
      - targets:
          - 'prometheus:9090'

  - job_name: node_exporter
    scrape_interval: 5s
    scrape_timeout: 2s
    static_configs:
      - targets:
          - '{{host_ip}}:9100'

  # Weitere Exporter können hier hinzugefügt werden
  # Beispiel:
  # - job_name: mysql_exporter
  #   scrape_interval: 5s
  #   scrape_timeout: 2s
  #   static_configs:
  #     - targets:
  #         - '192.168.2.243:9104'